<style>
  :root {
    --bg: #07090d;
    --term: #0b0e14;
    --term-2: #0f131b;
    --line: #1c2230;
    --fg: #c9d1d9;
    --dim: #6b7485;
    --faint: #3a4253;
    --green: #38e07b;
    --cyan: #5ccfe6;
    --blue: #73a7ff;
    --yellow: #ffcc66;
    --red: #ff6b6b;
    --magenta: #d4a6ff;
    --orange: #ffa759;
    --sel: #16202e;
    --glow: 0 0 18px rgba(56, 224, 123, .25);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 20% -10%, #10202a 0%, transparent 60%),
                radial-gradient(900px 600px at 110% 110%, #1a1426 0%, transparent 55%),
                var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::selection { background: var(--green); color: var(--term); }

  .wrap {
    height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
  }
  .window {
    width: min(1180px, 100%);
    height: min(820px, 100%);
    display: flex; flex-direction: column;
    background: var(--term);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 40px 120px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.02) inset;
    overflow: hidden;
    position: relative;
  }
  /* scanlines + vignette */
  .window::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }

  .titlebar {
    height: 38px; flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px;
    background: linear-gradient(#141923, #10141c);
    border-bottom: 1px solid var(--line);
    user-select: none;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .titlebar .title {
    flex: 1; text-align: center; color: var(--dim); font-size: 12px;
    margin-right: 52px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .titlebar .title b { color: var(--fg); font-weight: 500; }

  .pane {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 18px 22px 10px;
    scrollbar-width: thin; scrollbar-color: var(--faint) transparent;
    cursor: text;
  }
  .pane::-webkit-scrollbar { width: 8px; }
  .pane::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 4px; }

  .ln { white-space: pre-wrap; word-break: break-word; min-height: 1.55em; }
  .dim { color: var(--dim); } .faint { color: var(--faint); }
  .g { color: var(--green); } .c { color: var(--cyan); } .b { color: var(--blue); }
  .y { color: var(--yellow); } .r { color: var(--red); } .m { color: var(--magenta); } .o { color: var(--orange); }
  .bold { font-weight: 700; }
  a { color: var(--cyan); text-decoration: none; border-bottom: 1px dashed rgba(92,207,230,.4); }
  a:hover { color: var(--term); background: var(--cyan); border-bottom-color: transparent; }

  .prompt-user { color: var(--green); font-weight: 700; }
  .prompt-path { color: var(--blue); font-weight: 700; }
  .cursor {
    display: inline-block; width: .6em; height: 1.2em; vertical-align: -.2em;
    background: var(--green); box-shadow: var(--glow);
    animation: blink 1.05s steps(1) infinite;
  }
  .cursor.solid { animation: none; }
  @keyframes blink { 50% { opacity: 0; } }

  .banner {
    color: var(--green); text-shadow: var(--glow);
    font-weight: 700; line-height: 1.12; font-size: 13px;
    white-space: pre; overflow: hidden;
  }
  .banner .acc { color: var(--cyan); text-shadow: 0 0 18px rgba(92,207,230,.3); }

  .bar { color: var(--green); }

  /* project picker */
  .picker {
    display: grid; grid-template-columns: minmax(260px, 360px) 1fr;
    gap: 0; margin: 6px 0 4px;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    background: var(--term-2);
  }
  .picker.done { opacity: .55; }
  .picker-head {
    grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px;
    padding: 6px 12px; border-bottom: 1px solid var(--line);
    background: #111621; color: var(--dim); font-size: 12px;
  }
  .picker-head .g { font-weight: 700; }
  .plist { list-style: none; margin: 0; padding: 6px 0; border-right: 1px solid var(--line); }
  .pitem {
    display: flex; align-items: center; gap: 10px;
    padding: 3px 12px; cursor: pointer; white-space: nowrap;
    border-left: 2px solid transparent;
  }
  .pitem .arrow { width: 1ch; color: var(--green); }
  .pitem .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .pitem .kind { color: var(--faint); font-size: 12px; }
  .pitem:hover { background: rgba(255,255,255,.025); }
  .pitem.active { background: var(--sel); border-left-color: var(--green); }
  .pitem.active .name { color: #fff; font-weight: 700; }
  .pitem.active .kind { color: var(--dim); }
  .st { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .st.live { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .st.repo { background: var(--blue); }
  .st.hw   { background: var(--orange); }
  .st.wip  { background: var(--yellow); }

  .preview { padding: 12px 16px; min-width: 0; }
  .preview h3 { margin: 0 0 2px; font-size: 16px; color: #fff; }
  .preview .tag { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .preview p { margin: 0 0 12px; }
  .kv { display: grid; grid-template-columns: 8ch 1fr; gap: 2px 12px; font-size: 13px; }
  .kv dt { color: var(--dim); } .kv dd { margin: 0; min-width: 0; word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11.5px; padding: 0 7px; border-radius: 4px;
    background: rgba(115,167,255,.1); color: var(--blue); border: 1px solid rgba(115,167,255,.2);
  }
  .keys { padding: 6px 12px; grid-column: 1 / -1; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  kbd {
    font-family: inherit; font-size: 11px; padding: 0 5px; border-radius: 3px;
    border: 1px solid var(--faint); border-bottom-width: 2px; color: var(--fg); background: #141a25;
  }

  .card {
    display: inline-block; margin: 4px 0; padding: 10px 16px;
    border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 6px;
    background: var(--term-2);
  }

  /* tmux status */
  .status {
    flex: none; height: 26px; display: flex; align-items: stretch;
    background: #0f1a14; border-top: 1px solid #173123;
    font-size: 12.5px; user-select: none; white-space: nowrap; overflow: hidden;
  }
  .status .sess { background: var(--green); color: #06110a; font-weight: 800; padding: 0 12px; display: flex; align-items: center; }
  .status .wins { display: flex; align-items: center; padding: 0 6px; gap: 2px; flex: 1; overflow: hidden; }
  .status .win { padding: 0 8px; color: #7fa48c; cursor: pointer; border-radius: 3px; }
  .status .win:hover { color: #d7f5e1; }
  .status .win.on { color: #06110a; background: #8bf0b2; font-weight: 700; }
  .status .right { display: flex; align-items: center; gap: 14px; padding: 0 12px; color: #7fa48c; }
  .status .right .host { background: #1d3a29; color: #bff3d3; padding: 0 10px; margin-right: -12px; height: 100%; display: flex; align-items: center; }

  /* mobile command bar */
  .quick { display: none; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); background: #0d1118; overflow-x: auto; flex: none; }
  .quick button {
    font: inherit; font-size: 12.5px; color: var(--green); background: transparent;
    border: 1px solid #1f3b2b; border-radius: 6px; padding: 5px 10px; white-space: nowrap; cursor: pointer;
  }
  .quick button:active { background: #12271b; }

  /* hidden input that receives typing (and opens the soft keyboard on phones) */
  #kb { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; font-size: 16px; caret-color: transparent; pointer-events: none; }

  @media (max-width: 760px) {
    body { font-size: 12.5px; }
    .wrap { padding: 0; }
    .window { height: 100%; border-radius: 0; border: 0; }
    .pane { padding: 12px 16px 8px; }
    .banner { font-size: 7.4px; }
    .picker { grid-template-columns: 1fr; }
    .plist { border-right: 0; border-bottom: 1px solid var(--line); }
    .quick { display: flex; }
    .status .wins .win:not(.on) { display: none; }
    .status .right .clock { display: none; }
    .titlebar .title { margin-right: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>

const STATUS_LABEL = { live: ["live", "g"], repo: ["source", "b"], hw: ["hardware", "o"], wip: ["wip", "y"] };

// ─── terminal core ───────────────────────────────────────────────────────
const pane = document.getElementById("pane");
const kb = document.getElementById("kb");
const titleEl = document.getElementById("title");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const touch = matchMedia("(pointer: coarse)").matches;

let mode = "boot";           // boot | prompt | busy | select | contact
let fast = reduced;          // skip animations
let input = "";
let history = [];
let histIdx = -1;
let promptEl = null;
let picker = null;
let cwd = "~";
let queue = null;            // while a command runs, its output is collected here and printed line by line
let typeahead = "";          // keys typed while a command was still printing, replayed at the next prompt

const sleep = ms => new Promise(r => setTimeout(r, fast ? 0 : ms));
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const scroll = () => { pane.scrollTop = pane.scrollHeight; };
const link = url => `<a href="${url}" target="_blank" rel="noopener">${esc(url.replace(/^https:\/\//, ""))}</a>`;
const time = () => new Date().toTimeString().slice(0, 8);

function line(html = "", cls = "ln") {
  const el = document.createElement("div");
  el.className = cls;
  el.innerHTML = html;
  if (queue) queue.push(el);
  else { pane.appendChild(el); scroll(); }
  return el;
}
// inside command output: wait before printing what comes next
const pause = ms => { if (queue) queue.push(ms); };

async function flush() {
  const items = queue;
  queue = null;
  for (const it of items) {
    if (typeof it === "number") { await sleep(it); continue; }
    pane.appendChild(it);
    scroll();
    await sleep(18);
  }
}

const PS1_LOCAL = `<span class="prompt-user">guest@local</span><span class="dim">:</span><span class="prompt-path">~</span><span class="dim">$</span> `;
const ps1 = () => `<span class="prompt-user">guest@erickmob</span><span class="dim">:</span><span class="prompt-path">${cwd}</span><span class="dim">$</span> `;

async function typeInto(el, prefix, text, speed = 55) {
  for (let i = 1; i <= text.length; i++) {
    el.innerHTML = prefix + esc(text.slice(0, i)) + '<span class="cursor solid"></span>';
    scroll();
    await sleep(speed + Math.random() * speed * 0.8);
  }
  await sleep(260);
  el.innerHTML = prefix + esc(text);
}

async function spinner(label, ms, okText = "ok") {
  const frames = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
  const el = line();
  const end = Date.now() + (fast ? 0 : ms);
  let i = 0;
  while (Date.now() < end) {
    el.innerHTML = `<span class="c">${frames[i++ % frames.length]}</span> ${label}`;
    await new Promise(r => setTimeout(r, 70));
    if (fast) break;
  }
  el.innerHTML = `<span class="g">✔</span> ${label} <span class="dim">${okText}</span>`;
}

async function progress(label, ms) {
  const el = line();
  const W = 28, steps = 24;
  for (let s = 0; s <= steps; s++) {
    const n = Math.round((s / steps) * W);
    el.innerHTML = `${label} <span class="bar">${"█".repeat(n)}</span><span class="faint">${"░".repeat(W - n)}</span> <span class="dim">${String(Math.round(s / steps * 100)).padStart(3)}%</span>`;
    await sleep(ms / steps);
  }
}

// ─── boot sequence ───────────────────────────────────────────────────────
const BANNER = String.raw`
 ███████╗██████╗ ██╗ ██████╗██╗  ██╗███╗   ███╗ ██████╗ ██████╗
 ██╔════╝██╔══██╗██║██╔════╝██║ ██╔╝████╗ ████║██╔═══██╗██╔══██╗
 █████╗  ██████╔╝██║██║     █████╔╝ ██╔████╔██║██║   ██║██████╔╝
 ██╔══╝  ██╔══██╗██║██║     ██╔═██╗ ██║╚██╔╝██║██║   ██║██╔══██╗
 ███████╗██║  ██║██║╚██████╗██║  ██╗██║ ╚═╝ ██║╚██████╔╝██████╔╝
 ╚══════╝╚═╝  ╚═╝╚═╝ ╚═════╝╚═╝  ╚═╝╚═╝     ╚═╝ ╚═════╝ ╚═════╝ <span class="acc">.dev</span>`;

function fingerprint() {
  const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  return Array.from({ length: 43 }, () => abc[Math.random() * 64 | 0]).join("");
}

async function boot() {
  mode = "boot";
  typeahead = "";
  cwd = "~";
  pane.innerHTML = "";
  titleEl.innerHTML = "<b>guest@local</b> — zsh — 120×40";
  line(`<span class="dim">Last login: ${new Date(Date.now() - 864e5 * 3).toString().slice(0, 24)} on ttys001</span>`);
  const skip = line(`<span class="faint">(${touch ? "tap" : "press any key"} to skip)</span>`);
  await sleep(500);

  const cmd = line();
  await typeInto(cmd, PS1_LOCAL, "ssh guest@erickmob.dev", 45);
  skip.remove();

  line(`<span class="dim">debug1: Connecting to erickmob.dev [443] port 22.</span>`);
  await sleep(380);
  line(`<span class="dim">debug1: Connection established.</span>`);
  await sleep(220);
  line(`<span class="dim">debug1: Remote protocol version 2.0, remote software version OpenSSH_9.9</span>`);
  await sleep(200);
  line(`<span class="dim">debug1: kex: algorithm: </span>sntrup761x25519-sha512<span class="dim"> · cipher: </span>chacha20-poly1305`);

  await spinner("Establishing encrypted channel", 650, "secure");
  await spinner("Allocating pty · attaching tmux session <span class='g'>erickmob</span>", 600, "attached");
  await progress("Syncing projects", 800);
  await sleep(250);

  titleEl.innerHTML = "<b>guest@erickmob</b> — tmux — 120×40";
  pane.innerHTML = "";
  line(BANNER, "banner");

  line(`  <span class="dim">${PROJECTS.length} projects · ${PROJECTS.filter(p => p.status === "live").length} live · uptime ${uptime()} · load 0.04 0.03 0.01</span>`);
  line("");
  line(`  Type <span class="g">/help</span> for commands. Try <span class="g">/list-projects</span> or <span class="g">/contact</span>.`);
  if (touch) line(`  <span class="dim">Tap the screen to type, or use the buttons below.</span>`);
  line("");
  await sleep(500);

  newPrompt();
  await typeCommand("/list-projects");
  fast = reduced;
}

function uptime() {
  const d = Math.floor((Date.now() - new Date("2026-01-01").getTime()) / 864e5);
  return `${d} days`;
}

// ─── prompt ──────────────────────────────────────────────────────────────
function setInput(v) {
  input = v;
  kb.value = v;
}
function newPrompt() {
  mode = "prompt";
  setInput("");
  histIdx = -1;
  promptEl = line();
  renderPrompt();
  focusKb();
  if (!typeahead) return;
  const nl = typeahead.indexOf("\n");
  const typed = nl < 0 ? typeahead : typeahead.slice(0, nl);
  typeahead = nl < 0 ? "" : typeahead.slice(nl + 1);
  setInput(typed);
  renderPrompt();
  if (nl >= 0) submit(typed);
}
function renderPrompt() {
  if (promptEl) promptEl.innerHTML = ps1() + esc(input) + '<span class="cursor"></span>';
  scroll();
}
function freezePrompt() {
  if (promptEl) promptEl.innerHTML = ps1() + esc(input);
  promptEl = null;
}

async function submit(raw) {
  const text = raw.trim();
  freezePrompt();
  if (text) history.push(text);
  setWindow(text);
  mode = "busy";
  queue = [];
  const next = execute(text);
  await flush();
  if (next === "exit") return reconnect();
  if (next === "select" || next === "contact") { mode = next; return; }
  newPrompt();
}

// simulates the visitor typing a command (buttons, tmux tabs, boot)
async function typeCommand(cmd) {
  if (mode === "boot") { fast = true; return; }
  if (mode === "busy") return;
  if (mode === "select") { closePicker(); line(`<span class="dim">^C</span>`); newPrompt(); }
  else if (mode === "contact") newPrompt();
  mode = "busy";
  setInput("");
  for (const ch of cmd) {
    setInput(input + ch);
    renderPrompt();
    await sleep(40 + Math.random() * 50);
  }
  await sleep(220);
  submit(input);
}

// ─── commands ────────────────────────────────────────────────────────────
const MAIN = {
  "list-projects": { desc: "browse projects (↑/↓, enter)", fn: cmdProjects, alias: ["projects"] },
  "contact":       { desc: "how to reach me", fn: () => contactCard(true), alias: ["email", "mail"] },
  "about":         { desc: "who is this guy", fn: cmdAbout, alias: ["neofetch"] },
  "github":        { desc: "open my github profile", fn: cmdGithub },
  "help":          { desc: "show this help", fn: cmdHelp },
};

const SHELL = {
  pwd:      () => line(esc(cwd.replace(/^~/, "/home/guest"))),
  ls:       cmdLs,
  ll:       args => cmdLs(["-la", ...args]),
  cd:       cmdCd,
  cat:      cmdCat,
  open:     cmdOpen,
  echo:     args => line(esc(expand(args.join(" ")))),
  date:     () => line(new Date().toString()),
  whoami:   () => line("guest"),
  id:       () => line("uid=1000(guest) gid=1000(guest) groups=1000(guest),100(visitors)"),
  hostname: () => line("erickmob.dev"),
  uname:    args => line(args.includes("-a") ? "Linux erickmob 6.8.0-1015-oracle #16-Ubuntu SMP aarch64 GNU/Linux" : "Linux"),
  uptime:   () => line(` ${time()} up ${uptime()},  1 user,  load average: 0.04, 0.03, 0.01`),
  history:  () => history.forEach((h, i) => line(`${String(i + 1).padStart(5)}  ${esc(h)}`)),
  which:    cmdWhich,
  man:      ([c]) => line(c ? `No manual entry for ${esc(c)}. <span class="dim">Try</span> <span class="g">/help</span>` : "What manual page do you want?"),
  ping:     cmdPing,
  tmux:     () => line(`erickmob: 4 windows (created ${new Date(Date.now() - 36e5 * 5).toString().slice(0, 24)}) (attached)`),
  git:      () => { line("fatal: not a git repository (or any of the parent directories): .git"); line(`<span class="dim">the code lives at</span> ${link(GITHUB)}`); },
  clear:    () => { pane.innerHTML = ""; },
  sudo:     () => line(`<span class="r">guest is not in the sudoers file. This incident will be reported.</span>`),
  exit:     () => { line(`<span class="dim">logout</span>`); line(`<span class="dim">Connection to erickmob.dev closed.</span>`); return "exit"; },
};
for (const c of ["logout", "quit"]) SHELL[c] = SHELL.exit;
for (const c of ["vim", "vi", "nvim", "nano", "emacs"]) SHELL[c] = () => line(`<span class="dim">you'd never get out. try</span> <span class="g">/list-projects</span>`);
for (const c of ["rm", "mkdir", "touch", "mv", "cp", "chmod", "chown"]) SHELL[c] = () => line(`${c}: <span class="r">read-only file system</span> <span class="dim">— guests can look, not touch.</span>`);

function lookup(name) {
  const n = name.replace(/^\//, "").toLowerCase();
  for (const [k, v] of Object.entries(MAIN)) if (k === n || v.alias?.includes(n)) return { key: k, fn: v.fn };
  if (!name.startsWith("/") && SHELL[n]) return { key: n, fn: SHELL[n] };
  return null;
}

function execute(text) {
  if (!text) return;
  const [head, ...args] = text.split(/\s+/);
  const cmd = lookup(head);
  if (!cmd) {
    line(`<span class="r">zsh: command not found:</span> ${esc(head)} <span class="dim">— type</span> <span class="g">/help</span>`);
    return;
  }
  return cmd.fn(args);
}

function expand(s) {
  const vars = { USER: "guest", HOME: "/home/guest", SHELL: "/bin/zsh", PWD: cwd.replace(/^~/, "/home/guest"), HOSTNAME: "erickmob.dev" };
  return s.replace(/^["']|["']$/g, "").replace(/\$(\w+)/g, (_, v) => vars[v] ?? "");
}

function cmdPing([host = "erickmob.dev"]) {

// ─── fake filesystem ─────────────────────────────────────────────────────
const DOTFILES = {
  ".zshrc": ["export EDITOR=nvim", "bindkey -v", "alias g=git", "alias ll='ls -la'", "alias projects='/list-projects'", "PROMPT='%F{green}%n@%m%f:%F{blue}%~%f$ '"],
  ".tmux.conf": ["set -g prefix C-a", "set -g mouse on", "set -g status-style bg=#0f1a14,fg=#7fa48c", "bind | split-window -h", "bind - split-window -v"],
};

// "~"-relative path for arg, or null when it leaves the guest's home
function resolve(arg = "") {
  let rest = arg;
  let parts = cwd.split("/").slice(1);
  if (rest.startsWith("/home/guest")) { rest = rest.slice(11); parts = []; }
  else if (rest.startsWith("/")) return null;
  else if (rest.startsWith("~")) { rest = rest.slice(1); parts = []; }
  for (const p of rest.split("/")) {
    if (!p || p === ".") continue;
    if (p === "..") { if (!parts.length) return null; parts.pop(); }
    else parts.push(p);
  }
  return ["~", ...parts].join("/");
}

function node(path) {
  if (path === "~") return { dir: true, entries: ["about.md", "contact.txt", "projects/"], hidden: Object.keys(DOTFILES) };
  if (path === "~/projects") return { dir: true, entries: PROJECTS.map(p => p.id + "/") };
  const m = path.match(/^~\/projects\/([^/]+)(?:\/([^/]+))?$/);
  if (m) {
    const p = PROJECTS.find(x => x.id === m[1]);
    if (!p) return null;
    const files = { "README.md": () => projectInfo(p), "repo.url": () => line(link(p.repo)) };
    if (p.url) files["live.url"] = () => line(link(p.url));
    if (!m[2]) return { dir: true, entries: Object.keys(files) };
    return files[m[2]] ? { cat: files[m[2]] } : null;
  }
  if (path === "~/about.md") return { cat: cmdAbout };
  if (path === "~/contact.txt") return { cat: () => contactCard(false) };
  const dot = DOTFILES[path.slice(2)];
  if (path.startsWith("~/") && dot) return { cat: () => dot.forEach(l => line(esc(l))) };
  return null;
}

const isDir = nm => nm.endsWith("/") || nm === "." || nm === "..";
const fmt = nm => isDir(nm) ? `<span class="b bold">${esc(nm)}</span>` : esc(nm);

function cmdLs(args) {
  const flags = args.filter(a => a.startsWith("-")).join("");
  const target = args.find(a => !a.startsWith("-")) || "";
  const path = target ? resolve(target) : cwd;
  const n = path && node(path);
  if (!n) return line(`ls: cannot access '${esc(target)}': No such file or directory`);
  if (!n.dir) return line(esc(target));
  const names = [...(flags.includes("a") ? [".", "..", ...(n.hidden || [])] : []), ...n.entries];
  if (!flags.includes("l")) return line(names.map(fmt).join("  "));
  const stamp = new Date().toLocaleDateString("en-US", { month: "short", day: "2-digit" }) + " " + time().slice(0, 5);
  line(`total ${names.length * 4}`);
  names.forEach(nm => line(`${isDir(nm) ? "drwxr-xr-x" : "-rw-r--r--"}  1 guest  guest  ${String(isDir(nm) ? 4096 : 120 + nm.length * 37).padStart(5)} ${stamp} ${fmt(nm)}`));
}

function cmdCd([target = "~"]) {
  const path = resolve(target);
  if (path === null) return line(`cd: permission denied: ${esc(target)}`);
  const n = node(path);
  if (!n) return line(`cd: no such file or directory: ${esc(target)}`);
  if (!n.dir) return line(`cd: not a directory: ${esc(target)}`);
  cwd = path;
}

function cmdCat(args) {
  if (!args.length) return line(`<span class="dim">usage: cat &lt;file&gt; — try</span> cat about.md`);
  for (const a of args) {
    const path = resolve(a);
    const n = path && node(path);
    const p = !n && findProject(a);
    if (p) projectInfo(p);
    else if (!n) line(`cat: ${esc(a)}: No such file or directory`);
    else if (n.dir) line(`cat: ${esc(a)}: Is a directory`);
    else n.cat();
  }
}

function cmdOpen([target]) {
  const here = (!target || target === ".") && PROJECTS.find(x => cwd === "~/projects/" + x.id);
  const p = here || findProject(target);
  if (!p) return line(`open: ${esc(target || "")}: no such project <span class="dim">— try</span> <span class="g">/list-projects</span>`);
  openProject(p);
}

function projectInfo(p) {
  const [lbl, col] = STATUS_LABEL[p.status];
  line(`<span class="bold">${esc(p.name)}</span> <span class="dim"># ${esc(p.tag)}</span>`);
  line(esc(p.desc));
  line(`<span class="dim">status</span>  <span class="${col}">● ${lbl}</span>`);
  if (p.url) line(`<span class="dim">live  </span>  ${link(p.url)}`);
  line(`<span class="dim">repo  </span>  ${link(p.repo)}`);
  line(`<span class="dim">stack </span>  ${p.stack.map(esc).join(" · ")}`);
}

// ─── project picker ──────────────────────────────────────────────────────
function findProject(q) {
  q = (q || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  if (!q) return null;
  return PROJECTS.find(p => p.id.replace(/-/g, "") === q || p.name.toLowerCase().replace(/[^a-z0-9]/g, "").startsWith(q));
}

function openProject(p, which = "url") {
  const href = which === "repo" ? p.repo : (p.url || p.repo);
  line(`<span class="dim">→ opening</span> ${link(href)}`);
  window.open(href, "_blank", "noopener");
}

function cmdProjects() {
  const host = line();
  host.style.whiteSpace = "normal";
  host.innerHTML = `
    <div class="picker">
      <div class="picker-head"><span><span class="g">❯</span> select a project</span><span><span class="sel-count">1</span>/${PROJECTS.length}</span></div>
      <ul class="plist" role="listbox">${PROJECTS.map((p, i) => `
        <li class="pitem" data-i="${i}" role="option">
          <span class="arrow"></span><span class="st ${p.status}"></span>
          <span class="name">${esc(p.name)}</span><span class="kind">${p.kind}</span>
        </li>`).join("")}
      </ul>
      <div class="preview"></div>
      <div class="keys"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>enter</kbd> open · <kbd>r</kbd> repo · <kbd>q</kbd> quit</div>
    </div>`;
  const root = host.firstElementChild;
  picker = { root, idx: 0 };
  root.querySelectorAll(".pitem").forEach(li => {
    li.addEventListener("click", e => {
      e.stopPropagation();
      if (mode !== "select" || picker?.root !== root) return;
      const i = +li.dataset.i;
      if (i === picker.idx) choose("url"); else select(i);
    });
  });
  select(0);
  return "select";
}

function select(i) {
  const n = PROJECTS.length;
  picker.idx = (i + n) % n;
  const p = PROJECTS[picker.idx];
  picker.root.querySelectorAll(".pitem").forEach((li, j) => {
    const on = j === picker.idx;
    li.classList.toggle("active", on);
    li.setAttribute("aria-selected", on);
    li.querySelector(".arrow").textContent = on ? "❯" : "";
  });
  picker.root.querySelector(".sel-count").textContent = picker.idx + 1;
  const [lbl, col] = STATUS_LABEL[p.status];
  const live = p.url ? link(p.url) : `<span class="faint">—</span>`;
  picker.root.querySelector(".preview").innerHTML = `
    <h3>${esc(p.name)}</h3>
    <div class="tag"># ${esc(p.tag)}</div>
    <p>${esc(p.desc)}</p>
    <dl class="kv">
      <dt>status</dt><dd><span class="${col}">● ${lbl}</span></dd>
      <dt>live</dt><dd>${live}</dd>
      <dt>repo</dt><dd><a href="${p.repo}" target="_blank" rel="noopener">${esc(p.repo.replace(/^https:\/\/github.com\//, "gh:"))}</a></dd>
      <dt>stack</dt><dd><div class="chips">${p.stack.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div></dd>
    </dl>`;
  picker.root.querySelector(".pitem.active").scrollIntoView({ block: "nearest" });
}

function choose(which) {
  const p = PROJECTS[picker.idx];
  closePicker();
  openProject(p, which);
  newPrompt();
}
function closePicker() {
  picker.root.classList.add("done");
  picker = null;
}

// ─── keyboard ────────────────────────────────────────────────────────────
function complete() {
  if (!input.includes(" ")) {
    const slash = input.startsWith("/");
    const q = input.replace(/^\//, "");
    const names = slash ? Object.keys(MAIN) : [...Object.keys(MAIN), ...Object.keys(SHELL)];
    return offer("", names.filter(n => n.startsWith(q)).map(n => (MAIN[n] ? "/" : "") + n));
  }
  const head = input.slice(0, input.lastIndexOf(" ") + 1);
  const token = input.slice(head.length);
  const dirPart = token.slice(0, token.lastIndexOf("/") + 1);
  const base = token.slice(dirPart.length);
  const path = dirPart ? resolve(dirPart) : cwd;
  const n = path && node(path);
  if (!n?.dir) return;
  const entries = [...n.entries, ...(base.startsWith(".") ? n.hidden || [] : [])];
  offer(head, entries.filter(e => e.startsWith(base)).map(e => dirPart + e));
}

function offer(head, hits) {
  if (!hits.length) return;
  if (hits.length === 1) {
    setInput(head + hits[0] + (hits[0].endsWith("/") ? "" : " "));
    return renderPrompt();
  }
  let pre = hits[0];
  for (const h of hits) while (!h.startsWith(pre)) pre = pre.slice(0, -1);
  if (head + pre !== input) { setInput(head + pre); return renderPrompt(); }
  freezePrompt();
  line(hits.map(h => fmt(h.slice(h.lastIndexOf("/", h.length - 2) + 1))).join("   "));
  promptEl = line();
  renderPrompt();
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.altKey) return;
  const k = e.key;

  if (mode === "boot") { fast = true; e.preventDefault(); return; }
  if (mode === "contact") { e.preventDefault(); contactKey(k.toLowerCase()); return; }

  if (mode === "select") {
    if (k === "ArrowDown" || k === "j" || (k === "Tab" && !e.shiftKey)) { e.preventDefault(); select(picker.idx + 1); }
    else if (k === "ArrowUp" || k === "k" || (k === "Tab" && e.shiftKey)) { e.preventDefault(); select(picker.idx - 1); }
    else if (k === "Home" || k === "g") { e.preventDefault(); select(0); }
    else if (k === "End" || k === "G") { e.preventDefault(); select(PROJECTS.length - 1); }
    else if (k === "Enter" || k === "l" || k === "ArrowRight") { e.preventDefault(); choose("url"); }
    else if (k === "r") { e.preventDefault(); choose("repo"); }
    else if (k === "q" || k === "Escape" || (e.ctrlKey && k === "c")) {
      e.preventDefault(); closePicker(); line(`<span class="dim">^C</span>`); newPrompt();
    }
    return;
  }

  if (mode === "busy") {
    if (e.ctrlKey) return;
    e.preventDefault();
    if (k === "Enter") typeahead += "\n";
    else if (k === "Backspace") typeahead = typeahead.slice(0, -1);
    else if (k.length === 1) typeahead += k;
    return;
  }

  if (e.ctrlKey) {
    if (k === "l") { e.preventDefault(); pane.innerHTML = ""; promptEl = line(); renderPrompt(); }
    else if (k === "u") { e.preventDefault(); setInput(""); renderPrompt(); }
    else if (k === "c" && !getSelection().toString()) { e.preventDefault(); setInput(input + "^C"); freezePrompt(); newPrompt(); }
    return;
  }
  // printable keys land in the hidden input, which drives the prompt
  if (document.activeElement !== kb) kb.focus({ preventScroll: true });

  if (k === "Enter") { e.preventDefault(); submit(input); }
  else if (k === "Tab") { e.preventDefault(); complete(); }
  else if (k === "ArrowUp") {
    e.preventDefault();
    if (!history.length) return;
    histIdx = histIdx < 0 ? history.length - 1 : Math.max(0, histIdx - 1);
    setInput(history[histIdx]); renderPrompt();
  } else if (k === "ArrowDown") {
    e.preventDefault();
    if (histIdx < 0) return;
    histIdx++;
    if (histIdx >= history.length) { histIdx = -1; setInput(""); } else setInput(history[histIdx]);
    renderPrompt();
  } else if (k === "ArrowLeft" || k === "ArrowRight" || k === "Home" || k === "End") e.preventDefault();
});

kb.addEventListener("input", () => {
  if (mode === "prompt") { input = kb.value; renderPrompt(); return; }
  // soft keyboards insert text without a usable keydown: keep it as typeahead too
  if (mode === "busy" && kb.value.startsWith(input)) typeahead += kb.value.slice(input.length);
  kb.value = input;
});
// mobile keyboards that don't send a usable Enter keydown submit the form instead
document.getElementById("kbf").addEventListener("submit", e => {
  e.preventDefault();
  if (mode === "prompt") submit(input);
});
function focusKb() {
  if (!touch) kb.focus({ preventScroll: true });
}
pane.addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if (act) { e.preventDefault(); contactKey(act.dataset.act); return; }
  if (e.target.closest("a")) return;
  if (mode === "boot") { fast = true; return; }
  if (mode === "contact") { contactKey(""); return; }
  if (!getSelection().toString()) kb.focus({ preventScroll: true });
});
window.visualViewport?.addEventListener("resize", scroll);

document.querySelectorAll("[data-cmd]").forEach(b => b.addEventListener("click", e => {
  e.stopPropagation();
  typeCommand(b.dataset.cmd);
}));

// ─── tmux status ─────────────────────────────────────────────────────────
function setWindow(cmd) {
  const key = lookup(cmd.split(/\s+/)[0] || "")?.key;
  const target = { "list-projects": 1, contact: 2, about: 3 }[key] ?? 0;
  document.querySelectorAll("#wins .win").forEach((w, i) => {
    w.classList.toggle("on", i === target);
    w.textContent = w.textContent.replace(/\*$/, "") + (i === target ? "*" : "");
  });
}
function tick() {
  const d = new Date();
  document.getElementById("clock").textContent =
    d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) + " " +
    d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}
tick(); setInterval(tick, 15000);

async function reconnect() {
  titleEl.innerHTML = "<b>guest@local</b> — zsh — 120×40";
  await sleep(900);
  line(`<span class="dim">…reconnecting, you can't leave that easily.</span>`);
  await sleep(900);
  boot();
}

// real reachability check of the shared backend (opaque response is enough)
const apiEl = document.getElementById("api");
fetch("https://api.erickmob.dev/health", { mode: "no-cors", cache: "no-store" })
  .then(() => { apiEl.innerHTML = '<span style="color:#38e07b">●</span> api'; apiEl.title = "api.erickmob.dev reachable"; })
  .catch(() => { apiEl.innerHTML = '<span style="color:#ff6b6b">●</span> api'; apiEl.title = "api.erickmob.dev unreachable"; });

boot();
</script>
